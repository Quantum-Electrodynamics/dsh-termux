name: Build Termux release

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "Upstream @deepseek-ai/dsh version (blank = auto: highest unbuilt of latest/next). Prereleases such as 0.1.6-alpha.2 must be given explicitly - the scheduled path deliberately never picks an alpha tag."
        required: false
        type: string
      force:
        description: "Build even when this upstream version already has a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: dsh-termux-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.version.outputs.build }}
      upstream: ${{ steps.version.outputs.upstream }}
      revision: ${{ steps.version.outputs.revision }}
      termux: ${{ steps.version.outputs.termux }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM: ${{ inputs.upstream_version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          upstream="${INPUT_UPSTREAM:-}"
          if [[ -z "$upstream" ]]; then
            # 自动检测：在 latest/next 中取 semver 最高、且尚无 vX-termux.N release 的版本
            upstream="$(node -e '
              const { execSync } = require("node:child_process");
              const tags = JSON.parse(execSync("npm view @deepseek-ai/dsh dist-tags --json").toString());
              const existing = new Set(
                execSync("gh release list --limit 200 --json tagName --jq .[].tagName").toString()
                  .split("\n").map((l) => l.trim().replace(/^v/, "").replace(/-termux\.\d+$/, "")).filter(Boolean)
              );
              const all = [...new Set([tags.latest, tags.next].filter(Boolean))];
              const key = (v) => {
                const m = v.match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+.*)?$/);
                if (!m) return [0, 0, 0, -1];
                const base = [+m[1], +m[2], +m[3]];
                if (!m[4]) return [...base, 1];
                const pre = m[4].split(".");
                const pname = pre[0].replace(/[0-9]/g, "");
                const pnum = parseInt((pre[0].match(/\d+/) || [0])[0]) || 0;
                return [...base, 0, pname, pnum];
              };
              const sorted = all.sort((a, b) => {
                const ka = key(a), kb = key(b);
                const n = Math.max(ka.length, kb.length);
                for (let i = 0; i < n; i++) {
                  if (ka[i] !== kb[i]) return ka[i] < kb[i] ? 1 : -1;
                }
                return 0;
              });
              process.stdout.write(sorted.find((v) => !existing.has(v)) || "");
            ')"
            if [[ -z "$upstream" ]]; then
              echo "::notice::latest/next 均已有 termux 包，跳过"
              upstream="$(npm view @deepseek-ai/dsh version)"
            fi
          fi

          mapfile -t tags < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
          revision=1
          found=false
          for tag in "${tags[@]}"; do
            if [[ "$tag" =~ ^v${upstream//./\.}-termux\.([0-9]+)$ ]]; then
              found=true
              candidate="${BASH_REMATCH[1]}"
              if (( candidate >= revision )); then revision=$((candidate + 1)); fi
            fi
          done

          build=true
          if [[ "$found" == true && "${INPUT_FORCE:-false}" != true ]]; then build=false; fi
          termux="${upstream}-termux.${revision}"
          {
            echo "build=$build"
            echo "upstream=$upstream"
            echo "revision=$revision"
            echo "termux=$termux"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
      # No Android NDK is installed here any more. build-termux-prebuilt.sh assembles the package
      # from the official koffi Android prebuild plus a pinned node-pty binary, so the
      # `Install Android NDK` step (android-actions/setup-android@v3) that failed every scheduled
      # run - and the sdkmanager/cmake/ninja installs it required - are no longer needed.
      - name: Build offline Termux package
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_VERSION: ${{ needs.check.outputs.upstream }}
          TERMUX_REVISION: ${{ needs.check.outputs.revision }}
        run: |
          set -euo pipefail
          # The runner has no dsh-termux installed to copy the node-pty android-arm64 prebuild
          # from, so it is taken out of the most recent published release tarball. Its sha256 is
          # verified inside build-termux-prebuilt.sh before the binary is used.
          pty_url=""
          latest_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          if [[ -n "$latest_tag" ]]; then
            pty_url="https://github.com/${{ github.repository }}/releases/download/${latest_tag}/dsh-termux.tgz"
          fi
          NODE_PTY_PREBUILD_URL="$pty_url" bash scripts/build-termux-prebuilt.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-termux-${{ needs.check.outputs.termux }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dsh-termux-${{ needs.check.outputs.termux }}
          path: dist
      - name: Create release notes
        run: bash scripts/release-notes.sh "${{ needs.check.outputs.termux }}" "${{ needs.check.outputs.upstream }}" > release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.check.outputs.termux }}"
          # A prerelease must never take over the stable `latest` pointer: publishing
          # 0.1.6-alpha.2 with --latest would point users of the plain `latest` tag at an
          # alpha build. Prereleases therefore pass --prerelease and NOT --latest; only
          # stable versions pass --latest.
          case "$version" in
            *-alpha.*|*-beta.*|*-rc.*) flags=(--prerelease) ;;
            *) flags=(--latest) ;;
          esac
          gh release create "v$version" \
            "dist/dsh-termux-$version.tgz" \
            "dist/dsh-termux-$version.tgz.sha256" \
            "dist/dsh-termux.tgz" \
            --title "dsh-termux $version" \
            --notes-file release-notes.md \
            "${flags[@]}"
